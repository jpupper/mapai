<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <style>
    html, body { height: 100%; margin:0; }
    body{padding-top:48px!important;}
    .wrap { height: 100%; display: flex; flex-direction: column; }
    .frame { flex: 1; width: 100%; border: 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <iframe id="map-frame" class="frame" title="Mapa"></iframe>
  </div>

  <script src="js/navbar.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const project = urlParams.get('project') || 'diplomatura';
    const parts = window.location.pathname.split('/').filter(Boolean);
    const app = parts[0];
    const base = (app === 'mapai') ? '/' + app : '';
    const src = base + '/mapa.html?project=' + encodeURIComponent(project);
    document.getElementById('map-frame').src = src;
  </script>
  <!-- botón FSC: solo el isotipo, abajo a la izquierda -->
  <script src="https://vps-4455523-x.dattaweb.com/fscauth/js/fsc-button.js?v=9"></script>
</body>
</html>
